<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LRN Snippet</title>
    <style>
      body { font-family: Arial, sans-serif; width: 350px; padding: 16px; }
      input, textarea, button { width: 100%; box-sizing: border-box; margin-top: 6px; }
      textarea { min-height: 100px; }
    </style>
  </head>
  <body>
    <h3>Enregistrer un snippet</h3>

    <label>URL API</label>
    <input id="apiUrl" type="text" value="http://127.0.0.1:8000/api/snippets" />

    <label>Token Sanctum</label>
    <input id="token" type="password" placeholder="Coller le token" />

    <label>URL source</label>
    <input id="sourceUrl" type="text" placeholder="URL de la page" />

    <label>Contenu</label>
    <textarea id="content" placeholder="Le texte sélectionné apparaîtra ici..."></textarea>

    <button id="saveBtn">Enregistrer</button>

    <p id="status"></p>

    <script src="popup.js"></script>
  </body>
</html>
